# Clear Vision default configuration. All tunable numbers live here.

camera:
  source: 0            # webcam index, video file path, or stream URL
  width: 1280
  height: 720
  stale_timeout: 2.0   # seconds without a new frame before camera is unhealthy

detector:
  model_path: models/yolo11n.pt   # auto-downloaded on first use
  conf: 0.4                       # minimum confidence to keep a detection
  imgsz: 640                      # inference size in pixels
  device: auto                    # auto | mps | cpu (auto uses MPS only on macOS 15+)
  cpu_threads: 4                  # M1 has 4 performance cores; 4 beat 8 in benchmarks
  allowed_classes:
    - person
    - bicycle
    - car
    - motorcycle
    - bus
    - truck
    - bench
    - chair
    - dog
    - fire hydrant
    - stop sign
    - potted plant

navigator:
  # Direction: frame split by box center_x (0 = left edge, 1 = right edge)
  left_boundary: 0.333       # center_x below this -> "left"
  right_boundary: 0.667      # center_x above this -> "right", in between -> "ahead"
  # Proximity: normalized box height (fraction of frame height)
  near_height: 0.5           # height > this -> "near"
  mid_height: 0.25           # height >= this -> "mid", else "far"
  # Risk = proximity_weight * direction_weight * severity
  proximity_weights:
    near: 1.0
    mid: 0.6
    far: 0.3
  ahead_weight: 1.5
  side_weight: 1.0
  severity:
    car: 3
    bus: 3
    truck: 3
    motorcycle: 3
    bicycle: 3
    person: 2
    dog: 2
    pole: 2
    fire hydrant: 2
    bench: 1
    chair: 1
    potted plant: 1
    stop sign: 1
  default_severity: 1        # classes missing from the severity table
  risk_threshold: 1.0        # objects below this risk are not announced
  cooldown: 4.0              # seconds before repeating the same class + direction
  urgent_cooldown: 1.5       # shorter repeat time for urgent (ahead + near) warnings

speaker:
  rate: 220                  # words per minute
  backend: auto              # auto | pyttsx3 | say (auto = `say` on macOS, pyttsx3 elsewhere)
